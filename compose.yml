# When running docker compose, use --env-file (e.g. /etc/openclaw/stack.env) so
# OPENCLAW_GATEWAY_TOKEN and OPENCLAW_GUARD_GATEWAY_TOKEN are set; otherwise you'll see warnings.
services:
  browser:
    image: lscr.io/linuxserver/webtop:ubuntu-xfce
    container_name: ${INSTANCE:-op-and-chloe}-browser
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    volumes:
      - ${BROWSER_CONFIG_DIR:-/var/lib/openclaw/browser}:/config
      - ${BROWSER_CONFIG_DIR:-/var/lib/openclaw/browser}/custom-cont-init.d:/custom-cont-init.d
    ports:
      - "${NOVNC_HOST:-127.0.0.1}:${NOVNC_PORT:-6080}:3000"
    shm_size: "1gb"
    restart: unless-stopped
    networks:
      openclaw_net:
        ipv4_address: ${BROWSER_IPV4:-172.31.0.10}

  site-proxy:
    image: caddy:2
    container_name: ${INSTANCE:-op-and-chloe}-site-proxy
    profiles: ["sites"]
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile", "--watch"]
    ports:
      - "${SITES_HTTP_HOST:-0.0.0.0}:${SITES_HTTP_PORT:-80}:80"
      - "${SITES_HTTPS_HOST:-0.0.0.0}:${SITES_HTTPS_PORT:-443}:443"
    volumes:
      - ${OPENCLAW_WORKSPACE_DIR:-/var/lib/openclaw/chloe/workspace}:/srv/chloe-workspace:ro
      # Mount the directory (not the file alone): reconciler replaces sites.generated.caddy atomically;
      # a single-file bind can leave Caddy seeing a stale/empty inode until the container is recreated.
      - ${OPENCLAW_SITES_PROXY_CONFIG_DIR:-/etc/openclaw/sites-proxy}:/etc/caddy/sites-registry:ro
      - ${OPENCLAW_SITES_PROXY_DATA_DIR:-/var/lib/openclaw/sites-proxy/data}:/data
      - ${OPENCLAW_SITES_PROXY_STORAGE_DIR:-/var/lib/openclaw/sites-proxy/config}:/config
      - ${OPENCLAW_STACK_DIR:-/opt/op-and-chloe}/config/sites-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped

  sites-reconciler:
    image: python:3.12-slim
    container_name: ${INSTANCE:-op-and-chloe}-sites-reconciler
    profiles: ["sites"]
    environment:
      SITES_RECONCILE_INTERVAL: ${SITES_RECONCILE_INTERVAL:-5}
      SITES_BASE_DOMAIN: ${SITES_BASE_DOMAIN:-}
    command: ["/bin/sh", "/opt/op-and-chloe/scripts/sites/reconciler-loop.sh"]
    volumes:
      - ${OPENCLAW_WORKSPACE_DIR:-/var/lib/openclaw/chloe/workspace}:/srv/chloe-workspace
      - ${OPENCLAW_SITES_PROXY_CONFIG_DIR:-/etc/openclaw/sites-proxy}:/etc/openclaw
      - ${OPENCLAW_STACK_DIR:-/opt/op-and-chloe}:/opt/op-and-chloe:ro
    restart: unless-stopped

  openclaw-gateway:
    image: ${OPENCLAW_WORKER_IMAGE:-openclaw-worker-tools:local}
    build:
      context: .
      # Always refresh the base image tag (e.g. :main) so restarts do not keep a stale local copy
      pull: true
      dockerfile: docker/openclaw-worker-tools.Dockerfile
      args:
        OPENCLAW_BASE_IMAGE: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:main}
    container_name: ${INSTANCE:-op-and-chloe}-openclaw-gateway
    entrypoint: ["/bin/bash", "/opt/op-and-chloe/scripts/worker/entrypoint.sh"]
    network_mode: host
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      NPM_CONFIG_PREFIX: /home/node/.openclaw/npm-global
      PNPM_HOME: /home/node/.local/share/pnpm
      PATH: /opt/op-and-chloe/scripts/worker:/opt/op-and-chloe/scripts:/home/node/.local/share/pnpm:/home/node/.openclaw/npm-global/bin:/usr/local/bun/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - ${OPENCLAW_STATE_DIR:-/var/lib/openclaw/chloe/state}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR:-/var/lib/openclaw/chloe/workspace}:/home/node/.openclaw/workspace
      - ${OPENCLAW_STACK_DIR:-/opt/op-and-chloe}:/opt/op-and-chloe:ro
    init: true
    restart: unless-stopped
    command: ["node","dist/index.js","gateway","--bind","loopback","--port","18789","--allow-unconfigured"]

  openclaw-guard:
    image: ${OPENCLAW_GUARD_IMAGE:-openclaw-guard-tools:local}
    build:
      context: .
      pull: true
      dockerfile: docker/openclaw-guard-tools.Dockerfile
      args:
        OPENCLAW_BASE_IMAGE: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:main}
    container_name: ${INSTANCE:-op-and-chloe}-openclaw-guard
    entrypoint: ["/bin/bash", "/opt/op-and-chloe/scripts/guard/entrypoint.sh"]
    network_mode: host
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GUARD_GATEWAY_TOKEN}
      NPM_CONFIG_PREFIX: /home/node/.openclaw/npm-global
      PNPM_HOME: /home/node/.local/share/pnpm
      PATH: /opt/op-and-chloe/scripts/guard:/opt/op-and-chloe/scripts:/home/node/.local/share/pnpm:/home/node/.openclaw/npm-global/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - ${OPENCLAW_GUARD_STATE_DIR:-/var/lib/openclaw/guard/state}:/home/node/.openclaw
      - ${OPENCLAW_GUARD_WORKSPACE_DIR:-/var/lib/openclaw/guard/workspace}:/home/node/.openclaw/workspace
      - /var/lib/openclaw:/mnt/openclaw-data
      - /etc/openclaw:/mnt/etc-openclaw
      - /var/lib/openclaw/guard/state/ssh:/home/node/.ssh:ro
      - ${OPENCLAW_STACK_DIR:-/opt/op-and-chloe}:/opt/op-and-chloe
      - /var/run/docker.sock:/var/run/docker.sock
    init: true
    restart: unless-stopped
    command: ["node", "dist/index.js", "gateway", "--bind", "loopback", "--port", "18790", "--allow-unconfigured"]

networks:
  openclaw_net:
    name: ${INSTANCE:-op-and-chloe}-net
    driver: bridge
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.31.0.0/24}
